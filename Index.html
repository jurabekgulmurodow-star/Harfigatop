<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harfigatop</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4ff;--ink:#15173d;--card:#fff;--mute:#6b6f9c;--a:#2b4bff;--b:#d62a76;--hit:#ffd23f;--line:#d9dcf5;--bad:#d62a2a;--ok:#1d9a5a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1226;--ink:#eceeff;--card:#1a1e3d;--mute:#9a9fd0;--a:#7b92ff;--b:#ff6aa5;--line:#2c3160;--bad:#ff6b6b;--ok:#4cd68c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1226;--ink:#eceeff;--card:#1a1e3d;--mute:#9a9fd0;--a:#7b92ff;--b:#ff6aa5;--line:#2c3160;--bad:#ff6b6b;--ok:#4cd68c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:34px;font-weight:800;margin:6px 0 4px;letter-spacing:-.02em}
p.sub{color:var(--mute);margin:0 0 16px;line-height:1.45}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:6px}
input,textarea{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{font-size:16px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--hit);outline-offset:1px}
.row{display:flex;gap:10px}.row>*{flex:1}
button{font:inherit;font-weight:600;font-size:17px;padding:13px 16px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button.go{background:var(--a);color:#fff;font-size:19px;padding:15px}
button.sm{font-size:14px;padding:8px 12px}
button.red{background:var(--bad);color:#fff}
button{touch-action:manipulation}
#in{text-align:center;font-size:26px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;caret-color:transparent}
#in::placeholder{font-size:17px;font-weight:400;letter-spacing:0;text-transform:none}
.kb{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
.kr{display:flex;gap:4px;justify-content:center}
.k{flex:1;max-width:44px;min-width:0;padding:0;height:48px;font-size:19px;font-weight:700;text-transform:uppercase;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:9px}
.k:active{background:var(--hit);color:#15173d}
.k.w{max-width:68px;flex:1.6;font-size:20px}
.tiles{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.t{width:42px;height:48px;display:grid;place-items:center;font-weight:800;font-size:24px;border-radius:10px;background:var(--bg);border:1.5px solid var(--line);text-transform:uppercase}
.t.on{background:var(--hit);color:#15173d;border-color:var(--hit)}
.t.done{opacity:.4}
.pl{display:flex;gap:10px;margin-bottom:12px}
.p{flex:1;min-width:0;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card)}
.p.act{border-color:var(--c)}
.p b{display:block;color:var(--c);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p span{font-size:13px;color:var(--mute)}
.sc{font-size:28px;font-weight:800;line-height:1.1}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--c);width:100%}
.slots{display:flex;gap:6px;align-items:center;margin:12px 0 4px;flex-wrap:wrap}
.s{width:34px;height:52px;border-radius:9px;border:2px dashed var(--line)}
.s.hit{width:52px;display:grid;place-items:center;border:0;background:var(--hit);color:#15173d;font-size:32px;font-weight:800;text-transform:uppercase;transform:translateY(-3px)}
.msg{font-weight:600;font-size:17px;margin:0 0 10px}
.msg.ok{color:var(--ok)}.msg.no{color:var(--bad)}
.mn{font-weight:400;color:var(--mute)}
.big{font-size:30px;font-weight:800;margin:4px 0 12px}
.acc{display:flex;gap:12px;align-items:center;margin-bottom:14px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--card)}
.acc img{width:42px;height:42px;border-radius:50%}
.acc span{display:block;font-size:13px;color:var(--mute);line-height:1.35}
.err{color:var(--bad);margin:8px 0 0;min-height:1.2em;font-size:15px}
.code{font-size:56px;font-weight:800;letter-spacing:.16em;text-align:center;margin:8px 0;color:var(--a)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;display:none;z-index:5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-size:14px;margin-top:2px}
.tile span{display:block;font-size:12.5px;color:var(--mute);line-height:1.3;margin-top:2px}
.bw{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.bw>span{width:78px;flex:none;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{flex:1;height:12px;background:var(--line);border-radius:8px;overflow:hidden}
.bt i{display:block;height:100%;background:var(--a)}
.bw>b{width:34px;text-align:right}
.wr{padding:10px 0;border-top:1px solid var(--line)}
.wr:first-child{border-top:0}
.wr .w{font-size:19px;font-weight:800}
.tag{font-size:12px;font-weight:600;background:var(--hit);color:#15173d;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:middle}
.wr .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.ck{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--ink);margin:10px 0 0}
.ck input{width:auto}
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb td,.tb th{text-align:left;padding:6px 4px;border-top:1px solid var(--line)}
.tb th{color:var(--mute);font-weight:600;border-top:0}
.rl ul,.rl ol{margin:8px 0 0;padding-left:20px;line-height:1.6}
.rl b.h{display:block;font-size:18px;margin-bottom:2px}
.rl .lt{color:var(--a);font-weight:800}
.ex{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px;line-height:1.5}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
var WORDS="planet garden bridge sunset market orange forest castle winter silver jungle rocket dragon flower mirror pocket spring ticket window basket candle doctor island knight lemon storm river music tiger cloud piano ocean honey light dance paper bread chair smile blame travel button family guitar summer".split(" ");
var TARGETS={en:WORDS,uz:"qalam kitob daryo bahor oltin dengiz bulut yulduz sabzi gilam deraza osmon şahar mashina maktab daftar bozor tarvuz çiroq piyoz gözal ğalla köça böri".split(" ")};
var BANK={en:"apple animal answer anchor above ability bridge banana bottle button brave bread beach book basket castle chair cloud candle camera carpet dance dragon doctor dinner door eagle energy engine elephant earth forest flower friend finger garden guitar green grape ground house honey hammer horse island image ice insect jungle jacket jelly kitchen knight kettle king light lemon ladder letter market music mirror monkey moon mountain number night nature needle nurse orange ocean office onion paper planet pocket piano parrot puzzle queen quiet question river rocket rabbit road summer silver sunset spring stone storm street table tiger ticket travel turtle umbrella under valley violin voice village window winter water wonder yellow zebra simple single sister plane brain cream dream crown drive train trade slide small smile steel stare stand clean glass group place plant".split(" "),uz:"olma osmon oltin ona ota amaki aka bahor bola bozor bulut baliq daftar daryo dengiz deraza dala doktor eshik eski gilam gul guruh hovli havo hayot ilon issiq ikki inson kitob kuz kecha kuchuk kishi lola loçin maktab mashina mushuk non narx nok odam oila oyna oxir piçoq piyoz poyezd qalam qor qish qush qiz quyoş qovun radio rasm sabzi samolyot şahar şamol sovuq suv sut tabiat tarvuz taksi tosh tuz uzum uyqu uy ustoz vaqt vodiy yulduz yoz yomgir yigit yuz zamin zavod çoy çiroq çol dars dost dehqon öğil söz köl kök yöl töy böri çöl köça gözal ğalla ğoya ğarb ötkir".split(" ")};

/* ---------- soʻzlar bazasi (admin tahrirlaydi; boʻsh boʻlsa ichki roʻyxat ishlaydi) ---------- */
var LEX={en:null,uz:null};
function lexWords(l){var w=LEX[l]&&LEX[l].words;return w&&Object.keys(w).length?w:null;}
function targetsOf(l){var w=lexWords(l);if(w){var a=Object.keys(w).filter(function(k){return w[k].t&&k.length>=3&&k.length<=8;});if(a.length)return a;}return TARGETS[l];}
function bankOf(l){var w=lexWords(l);return w?Object.keys(w):BANK[l];}
function KNOWN(v,l){var w=lexWords(l);return w?!!w[v]:(BANK[l].indexOf(v)>-1||TARGETS[l].indexOf(v)>-1);}
function meaning(v,l){var w=lexWords(l);return w&&w[v]&&w[v].m?w[v].m:"";}

var UZX="öğşç";
function okW(v,l){return(l==="uz"?/^[a-zöğşç]+$/:/^[a-z]+$/).test(v);}
function spHtml(id){return '<div class="kr" style="justify-content:flex-start;margin:8px 0 0">'+UZX.split("").map(function(c){return '<button type="button" class="k" data-sp="'+id+'" data-c="'+c+'">'+c+'</button>';}).join("")+'</div><div class="sub" style="font-size:13px;margin:6px 0 0">ö = oʻ · ğ = gʻ · ş = sh · ç = ch</div>';}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-sp]");if(!b)return;var i=document.getElementById(b.dataset.sp);if(i){i.value+=b.dataset.c;i.focus();}});
var P={lang:"en",pick:null}, G=null, MODE="local", ME=0, PATH=null, UNSUB=null, RT=0, VIEW="home", lastTO="", REC={};
var MYBAL=null, PTS={};
var U=null, DB=null, SM=null, MYID=null, MEP=null, CANW=true, ADM=false;
var AT="stats", AL="en", AE=null, AD=null, ALIM=40;
var app=document.getElementById("app");

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]});}
function hearts(n){return "❤️".repeat(Math.max(n,0))||"💔";}
function rndL(l){var a=targetsOf(l);return a[Math.floor(Math.random()*a.length)];}
function clone(g){return JSON.parse(JSON.stringify(g));}
function $(id){return document.getElementById(id);}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none";},3500);}

/* ---------- oʻyin mantigʻi ---------- */
function newGame(lang,word,players){return{gid:Math.random().toString(36).slice(2,10),lang:lang,word:word,t:0,lives:[5,5],score:[0,0],used:[],last:null,phase:"play",deadline:Date.now()+10000,players:players,chal:0,fake:0};}
function cur(g){var n=g.word.length,r=Math.floor(g.t/n);return{pos:r+1,letter:g.word[g.t%n],p:(g.t+(n%2?0:r))%2};}
function advance(g){g.t++;g.deadline=Date.now()+10000;var n=g.word.length;if(g.t>=(n%2?4:3)*n||g.lives[0]<=0||g.lives[1]<=0)g.phase="over";return g;}
function applyMove(g,v,bad){
  g=clone(g);var c=cur(g),why=bad||null;
  if(!why){
    if(!okW(v,g.lang))why="ruxsat etilmagan harf";
    else if(v.length<c.pos||v[c.pos-1]!==c.letter)why=c.pos+"-harfi “"+c.letter.toUpperCase()+"” emas";
    else if(g.used.indexOf(v)>-1)why="takroriy soʻz";
  }
  if(why){g.lives[c.p]--;g.last={p:c.p,word:v,ok:false,why:why,pts:0};}
  else{var pts=v.length>=7?2:1;g.score[c.p]+=pts;g.used.push(v);g.last={p:c.p,word:v,ok:true,pts:pts};}
  return advance(g);
}
function applyTimeout(g,why){g=clone(g);var c=cur(g);g.lives[c.p]--;g.last={p:c.p,word:"",ok:false,why:why,pts:0};return advance(g);}
function applyChallenge(g,real){
  g=clone(g);var L=g.last,o=1-L.p;g.chal=(g.chal||0)+1;
  if(real){L.ch="real";g.score[o]=Math.max(g.score[o]-1,0);}
  else{L.ch="fake";g.fake=(g.fake||0)+1;g.score[L.p]=Math.max(g.score[L.p]-L.pts,0);g.lives[L.p]--;g.score[o]++;g.used=g.used.filter(function(x){return x!==L.word;});if(g.lives[L.p]<=0)g.phase="over";}
  return g;
}
function winner(g){var a=g.score[0],b=g.score[1];if(g.lives[0]<=0&&g.lives[1]>0)return 1;if(g.lives[1]<=0&&g.lives[0]>0)return 0;return a>b?0:b>a?1:-1;}

async function isReal(v,lang){
  if(KNOWN(v,lang))return true;
  if(!SM)return null;
  try{var r=await SM.json('Is "'+v+'" a real '+(lang==="uz"?"Uzbek (Latin script where ö=oʻ, ğ=gʻ, ş=sh, ç=ch)":"English")+' dictionary word? Reply only with JSON: {"real":true} or {"real":false}.');return !!(r&&r.real);}catch(e){return null;}
}
async function recordStats(me){
  if(!DB||!MYID||!CANW||REC[G.gid])return;REC[G.gid]=1;
  var g=G,w=winner(g),online=MODE==="online";
  var r={at:Date.now(),mode:online?"online":"bot",lang:g.lang,word:g.word,t:g.t,sc:g.score,lv:g.lives,w:w,ch:[g.chal||0,g.fake||0],me:me,ids:g.players||null,d:0};
  try{
    var ref=DB.doc("stats/"+MYID),s=await ref.get(),d=s.exists?(s.data()||{}):{};
    if(d.g&&d.g[g.gid]){if(typeof d.bal==="number")MYBAL=d.bal;setPts(g.gid,d.g[g.gid].d||0,online);return;}
    var bal=typeof d.bal==="number"?d.bal:500,delta=online?(w<0?3:(w===me?8:-8)):0;
    bal=Math.max(0,bal+delta);r.d=delta;var gg={};gg[g.gid]=r;
    if(s.exists)await ref.update({bal:bal,g:gg});else await ref.set({bal:bal,g:gg});
    MYBAL=bal;setPts(g.gid,delta,online);
  }catch(e){}
}
function setPts(gid,delta,online){
  var t=!online?"Bot bilan oʻyinda hisob balli oʻzgarmaydi.":(delta===8?"🏆 Gʻalaba: +8 ball":delta===3?"🤝 Durang: +3 ball":delta===-8?"💔 Magʻlubiyat: −8 ball":"Natija hisobga olingan.");
  if(online&&typeof MYBAL==="number")t+=" · Hisobingiz: "+MYBAL+" ball";
  PTS[gid]=t;var el=$("pts");if(el&&G&&G.gid===gid)el.textContent=t;
}
async function loadBal(){
  try{
    var ref=DB.doc("stats/"+MYID),s=await ref.get(),d=s.exists?(s.data()||{}):{};
    if(typeof d.bal==="number")MYBAL=d.bal;
    else{MYBAL=500;if(s.exists)await ref.update({bal:500});else await ref.set({bal:500});}
  }catch(e){}
}
function commit(g){
  if(MODE==="local"){G=g;render();}
  else{DB.doc(PATH).set(g).catch(function(){toast("Yozib boʻlmadi. Ulanishni tekshiring.");});}
}
function botMaybe(){
  if(MODE!=="local"||!G||G.phase!=="play"||cur(G).p!==1)return;
  var g0=G;
  setTimeout(function(){
    if(G!==g0)return;
    var c=cur(G),pool=bankOf(G.lang).filter(function(x){return x.length>=c.pos&&x[c.pos-1]===c.letter&&G.used.indexOf(x)<0;});
    if(!pool.length||Math.random()<.12)commit(applyTimeout(G,"bot soʻz topa olmadi"));
    else commit(applyMove(G,pool[Math.floor(Math.random()*pool.length)]));
  },1500+Math.random()*2500);
}

/* ---------- oʻyin ekranlari ---------- */
function home(){
  VIEW="home";G=null;MODE="local";var online=DB&&MYID&&CANW;
  var acc=MYID?'<div class="acc"><img src="'+esc(MEP.avatarUrl)+'" alt=""><div><b>'+esc(MEP.name||"Siz")+(ADM?' · admin':'')+'</b><span>claude.ai hisobingiz bilan kirdingiz</span>'+(MYBAL!==null?'<span style="margin-top:2px;color:var(--ink);font-weight:600">💰 '+MYBAL+' ball</span>':'')+'</div></div>'
    :'<div class="acc"><div><b>Hisobga kirilmagan</b><span>Onlayn oʻynash uchun claude.ai hisobingiz bilan kiring va havolani oching.</span></div></div>';
  app.innerHTML='<h1>Harfigatop ⚔️</h1><p class="sub">Tasodifiy soʻz tanlanadi. Uning harflari navbat bilan topshiriq boʻladi: 1-raundda soʻz shu harf bilan boshlanadi, 2-raundda ikkinchi harfi shu boʻladi va hokazo.</p>'+acc
  +'<div class="card"><button class="go" id="bot" style="width:100%">🤖 Bot bilan oʻynash</button></div>'
  +'<div class="card"><b>🌐 Onlayn oʻyin</b><p class="sub" style="margin:6px 0 12px">Doʻstingiz bilan alohida telefonlarda oʻynang.</p>'
  +(online?'<button id="mk" style="width:100%">Xona ochish</button><label style="margin-top:16px">Yoki xona kodi bilan qoʻshiling</label><div class="row"><input id="cd" maxlength="4" placeholder="ABCD" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase"><button id="jn" style="flex:0 0 auto">Kirish</button></div><p id="er" class="err"></p>'
  :'<p class="sub" style="margin:0">'+(MYID?'Onlayn oʻyin uchun sahifaga Contributor huquqi kerak.':'Hisob bilan kirganingizdan keyin ochiladi.')+'</p>')+'</div>'
  +'<div class="card"><button class="alt" id="rl" style="width:100%">📖 Oʻyin qoidalari</button></div>'+(ADM?'<div class="card"><button class="alt" id="adm" style="width:100%">🛠 Admin paneli (soʻzlar va statistika)</button></div>':'')
  +'<p class="sub" style="font-size:14px">5 ta jon ❤️ · 10 soniya · toʻgʻri soʻz +1, 7 va undan koʻp harfli +2 · onlayn oʻyinda raqibning soʻzini 🚩 challenge qilish mumkin.</p>';
  $("bot").onclick=function(){setup("bot");};
  $("rl").onclick=rules;
  if(ADM)$("adm").onclick=admin;
  if(online){
    $("mk").onclick=function(){setup("online");};
    $("jn").onclick=function(){joinRoom($("cd").value.trim().toUpperCase());};
    $("cd").onkeydown=function(e){if(e.key==="Enter")$("jn").click();};
  }
}
function rules(){
  VIEW="rules";
  app.innerHTML='<h1>Oʻyin qoidalari 📖</h1><p class="sub">Harfigatop — soʻz topish jangi. Qisqacha: tasodifiy soʻzning har bir harfi topshiriqqa aylanadi.</p>'
  +'<div class="card rl"><b class="h">1. Oʻyin qanday boshlanadi</b>Tasodifiy (yoki oʻzingiz yozgan) soʻz tanlanadi, masalan <b>BLAME</b>. Uning har bir harfi navbat bilan topshiriq boʻlib chiqadi.</div>'
  +'<div class="card rl"><b class="h">2. Raund nima</b>Raundlar soni soʻz uzunligiga bogʻliq: harflar soni <b>toq</b> boʻlsa — <b>4 raund</b>, <b>juft</b> boʻlsa — <b>3 raund</b> (BLAME 5 harfli, demak 4 raund). Ortiqcha raund qoʻshilmaydi. <b>N-raundda siz yozgan soʻzning N-harfi topshiriq harfi boʻlishi kerak.</b><ul><li><b>1-raund:</b> soʻz shu harf bilan boshlanadi. B uchun <i>book</i>, L uchun <i>light</i>.</li><li><b>2-raund:</b> soʻzning ikkinchi harfi shu boʻladi. B uchun <i>a<span class="lt">b</span>ility</i>, L uchun <i>p<span class="lt">l</span>ane</i>.</li><li><b>3-raund:</b> uchinchi harfi shu boʻladi, va hokazo.</li></ul>'
  +'<div class="ex">Masalan, 3-raund, topshiriq harfi <b>A</b>:<div class="slots" style="margin:8px 0"><div class="s"></div><div class="s"></div><div class="s hit">A</div></div>Mos soʻz: <i>br<span class="lt">a</span>ve</i> — uchinchi harfi A.</div></div>'
  +'<div class="card rl"><b class="h">3. Navbat va vaqt</b>Oʻyinchilar navbat bilan oʻynaydi. Har navbatda <b>10 soniya</b> bor, yuqoridagi chiziq vaqtni koʻrsatadi. Har bir raundda soʻzning barcha harflari boʻyicha topshiriq beriladi.</div>'
  +'<div class="card rl"><b class="h">4. Jonlar ❤️</b>Har oʻyinchida <b>5 ta jon</b> bor. Quyidagi hollarda 1 jon yoʻqotiladi:<ul><li>soʻzning kerakli harfi topshiriq harfiga mos kelmasa;</li><li>soʻz oldin aytilgan boʻlsa (takror);</li><li>soʻz haqiqiy boʻlmasa;</li><li>vaqt tugab qolsa.</li></ul></div>'

function mkCode(){var a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",s="";for(var i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
async function createRoom(word){
  try{
    var code,s;
    for(var i=0;i<5;i++){code=mkCode();s=await DB.doc("games/"+code).get();if(!s.exists)break;}
    var g=newGame(P.lang,word,[MYID,null]);g.phase="lobby";
    await DB.doc("games/"+code).set(g);
    watch(code);
  }catch(e){$("er").textContent="Xona ochib boʻlmadi. Ulanishni tekshiring.";}
}
async function joinRoom(code){
  var er=$("er");er.textContent="";
  if(code.length!==4){er.textContent="Kod 4 ta belgidan iborat.";return;}
  try{
    var ref=DB.doc("games/"+code),s=await ref.get();
    if(!s.exists){er.textContent="Bunday xona topilmadi.";return;}
    var g=s.data();
    if(g.players.indexOf(MYID)>-1){watch(code);return;}
    if(g.phase!=="lobby"||g.players[1]){er.textContent="Bu xona band.";return;}
    var ng=clone(g);ng.players[1]=MYID;ng.phase="play";ng.deadline=Date.now()+10000;
    await ref.set(ng);watch(code);
  }catch(e){er.textContent="Ulanib boʻlmadi. Qayta urinib koʻring.";}
}
function watch(code){
  MODE="online";PATH="games/"+code;if(UNSUB)UNSUB();
  UNSUB=DB.doc(PATH).onSnapshot(function(s){
    if(!s.exists){if(VIEW==="game"){leave();toast("Xona yopildi.");}return;}
    G=s.data();ME=G.players.indexOf(MYID);render();
  },function(){toast("Aloqa uzildi.");});
}
function leave(){
  if(UNSUB)UNSUB();UNSUB=null;

}

  else if(a==="d"){AD=k;AE=null;paintWords();}
  else if(a==="c"){AE=null;AD=null;paintWords();}
  else if(a==="m"){ALIM+=40;paintWords();}
  else if(a==="s"){var w=curWords(l);if(!w[k])return;w[k]={m:$("em").value.trim().slice(0,80),t:$("et").checked&&k.length>=3&&k.length<=8};AE=null;try{await lexSet(l,w);toast("Saqlandi");}catch(x){toast("Saqlab boʻlmadi");}}
  else if(a==="dy"){var w2=curWords(l);delete w2[k];AD=null;try{await lexSet(l,w2);toast("Oʻchirildi");}catch(x){toast("Oʻchirib boʻlmadi");}}
}
function needSeed(el){if(!lexWords(AL)){el.textContent="Avval yuqoridagi “Standart roʻyxatni bazaga yuklash” tugmasini bosing.";return true;}return false;}
async function addWord(){
  var er=$("ae");er.textContent="";if(needSeed(er))return;
  var k=$("aw").value.trim().toLowerCase();
  if(k.length<2||k.length>14||!okW(k,AL)){er.textContent="Soʻz 2–14 ta lotin harfidan iborat boʻlishi kerak.";return;}
  var w=curWords(AL),old=w[k];w[k]={m:$("am").value.trim().slice(0,80),t:$("at").checked&&k.length>=3&&k.length<=8};
  try{await lexSet(AL,w);toast(old?"Yangilandi":"Qoʻshildi");$("aw").value="";$("am").value="";$("aw").focus();}catch(x){er.textContent="Saqlab boʻlmadi. Qayta urinib koʻring.";}
}
async function bulkAdd(){
  var er=$("be");er.textContent="";if(needSeed(er))return;
  var w=curWords(AL),n=0,bad=0,tg=$("bt").checked;
  $("bk").value.split("\n").forEach(function(line){
    if(!line.trim())return;var m=line.match(/^\s*([a-zA-ZöğşçÖĞŞÇ]{2,14})\s*(?:[=:,\t-]\s*(.*))?$/);
    if(!m||!okW(m[1].toLowerCase(),AL)){bad++;return;}var k=m[1].toLowerCase();w[k]={m:(m[2]||"").trim().slice(0,80),t:tg&&k.length>=3&&k.length<=8};n++;
  });
  if(!n){er.textContent="Hech qanday toʻgʻri qator topilmadi. Namuna: apple = olma";return;}
  try{await lexSet(AL,w);$("bk").value="";toast(n+" ta soʻz yuklandi"+(bad?" ("+bad+" ta qator oʻtkazib yuborildi)":""));}catch(x){er.textContent="Yuklab boʻlmadi. Qayta urinib koʻring.";}
}
async function seed(){
  var l=AL,o={};BANK[l].concat(TARGETS[l]).forEach(function(k){if(!o[k])o[k]={m:"",t:false};});TARGETS[l].forEach(function(k){o[k].t=true;});
  try{await lexSet(l,o);toast("Standart roʻyxat yuklandi");}catch(e){toast("Yuklab boʻlmadi");}
}
async function fillMeanings(){
  var l=AL,w=lexWords(l),ks=Object.keys(w).filter(function(k){return !w[k].m;}).slice(0,25),b=$("cf");
  b.disabled=true;b.textContent="Claude yozmoqda…";
  try{
    var r=await SM.json('Give a short meaning (1-3 words) for each '+(l==="uz"?'Uzbek word (letters: ö=oʻ, ğ=gʻ, ş=sh, ç=ch), written in English':'English word, written in Uzbek (Latin script)')+'. Reply only with a JSON object mapping each word to its meaning. Words: '+ks.join(", "));
    var nw=curWords(l),n=0;
    ks.forEach(function(k){if(r&&typeof r[k]==="string"&&r[k].trim()&&nw[k]){nw[k].m=r[k].trim().slice(0,80);n++;}});
    await lexSet(l,nw);toast(n+" ta maʼno qoʻshildi. Tekshirib chiqing.");
  }catch(e){toast("Claude javob bera olmadi. Qayta urinib koʻring.");b.disabled=false;}
}

function tile(n,t,h){return '<div class="tile"><div class="sc">'+n+'</div><b>'+t+'</b><span>'+h+'</span></div>';}
function bars(rows){var mx=Math.max.apply(null,rows.map(function(r){return r[1];}).concat([1]));return rows.map(function(r){return '<div class="bw"><span>'+esc(r[0])+'</span><div class="bt"><i style="width:'+Math.round(r[1]/mx*100)+'%"></i></div><b>'+r[1]+'</b></div>';}).join("");}
async function adminStats(){
  var ab=$("ab");ab.innerHTML='<div class="card"><p class="sub" style="margin:0">Yuklanmoqda…</p></div>';
  var snap;try{snap=await DB.collection("stats").get();}catch(e){ab.innerHTML='<div class="card"><p class="msg no">Statistikani yuklab boʻlmadi.</p><button id="rt">Qayta urinish</button></div>';$("rt").onclick=adminStats;return;}
  var games={},pl=[];
  snap.docs.forEach(function(d){var g=(d.data()||{}).g||{},n=0,win=0,dr=0;Object.keys(g).forEach(function(k){var r=g[k];n++;if(r.w===r.me)win++;else if(r.w<0)dr++;if(!games[k])games[k]=r;});pl.push({id:d.id,n:n,win:win,dr:dr,bal:(d.data()||{}).bal});});
  var L=Object.keys(games).map(function(k){return games[k];}),N=L.length;
  if(!N){ab.innerHTML='<div class="card"><b>Hali statistika yoʻq</b><p class="sub" style="margin:6px 0 0">Birinchi oʻyin tugagach bu yerda maʼlumotlar paydo boʻladi. Statistika faqat hisob bilan kirgan oʻyinchilarning tugagan oʻyinlaridan yigʻiladi.</p></div><button class="alt" id="rf" style="width:100%">🔄 Yangilash</button>';$("rf").onclick=adminStats;return;}
  var onl=L.filter(function(r){return r.mode==="online";}).length,en=L.filter(function(r){return r.lang==="en";}).length,dr=L.filter(function(r){return r.w<0;}).length;
  var ch=0,fk=0,tt=0;L.forEach(function(r){ch+=(r.ch||[0,0])[0];fk+=(r.ch||[0,0])[1];tt+=r.t;});
  var tw={};L.forEach(function(r){tw[r.word]=(tw[r.word]||0)+1;});
  var top=Object.keys(tw).sort(function(a,b){return tw[b]-tw[a];}).slice(0,5).map(function(k){return[k.toUpperCase(),tw[k]];});
  var days=[];for(var i=6;i>=0;i--){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);days.push({s:d.getTime(),e:d.getTime()+864e5,l:("0"+d.getDate()).slice(-2)+"."+("0"+(d.getMonth()+1)).slice(-2),n:0});}
  L.forEach(function(r){days.forEach(function(d){if(r.at>=d.s&&r.at<d.e)d.n++;});});
  var rec=L.slice().sort(function(a,b){return b.at-a.at;}).slice(0,8),ids=pl.map(function(p){return p.id;});
  rec.forEach(function(r){(r.ids||[]).forEach(function(x){if(x&&ids.indexOf(x)<0)ids.push(x);});});
  var ps=U?await U.profiles(ids):{},nmOf=function(id){return(id&&ps[id]&&ps[id].name)||"Nomaʼlum";};
  var pt=pl.sort(function(a,b){return b.n-a.n;}).slice(0,10).map(function(p){return '<tr><td>'+esc(nmOf(p.id))+'</td><td>'+p.n+'</td><td>'+p.win+'</td><td>'+p.dr+'</td><td>'+(typeof p.bal==="number"?p.bal:"–")+'</td></tr>';}).join("");
  var rt=rec.map(function(r){
    var dt=new Date(r.at),ds=("0"+dt.getDate()).slice(-2)+"."+("0"+(dt.getMonth()+1)).slice(-2)+" "+("0"+dt.getHours()).slice(-2)+":"+("0"+dt.getMinutes()).slice(-2);
    var res=r.w<0?"durang":(r.ids&&r.ids[r.w]?nmOf(r.ids[r.w])+" yutdi":(r.w===0?"oʻyinchi yutdi":"bot yutdi"));
    return '<tr><td>'+ds+'</td><td>'+(r.mode==="online"?'🌐':'🤖')+(r.lang==="en"?'🇬🇧':'🇺🇿')+' '+esc(r.word.toUpperCase())+'</td><td>'+r.sc[0]+':'+r.sc[1]+'</td><td>'+esc(res)+'</td></tr>';
  }).join("");
  ab.innerHTML='<div class="g2">'
  +tile(N,'tugagan oʻyin','Oʻyin oxirigacha yetgan partiyalar soni')
  +tile(pl.length,'oʻyinchi','Oʻyinga hisob bilan kirib, 500 ball olganlar')
  +tile(onl,'onlayn oʻyin','Qolgan '+(N-onl)+' tasi bot bilan oʻynalgan')
  +tile(dr,'durang','Ball va jonlar teng chiqqan oʻyinlar')
  +tile((tt/N).toFixed(1),'oʻrtacha navbat','Bir oʻyinda nechta navbat oʻynalgani')
  +tile(ch+' / '+fk,'challenge','Jami challenge / shundan soʻz haqiqatan xato chiqqan')+'</div>'
  +'<div class="card"><b>Tillar</b><p class="sub" style="margin:4px 0 6px;font-size:13px">Qaysi tildagi oʻyinlar koʻproq oʻynalyapti</p>'+bars([['English',en],['Oʻzbekcha',N-en]])+'</div>'
  +'<div class="card"><b>Oxirgi 7 kun</b><p class="sub" style="margin:4px 0 6px;font-size:13px">Har kuni nechta oʻyin tugagan</p>'+bars(days.map(function(d){return[d.l,d.n];}))+'</div>'
  +'<div class="card"><b>Eng koʻp tanlangan oʻyin soʻzlari</b>'+bars(top)+'</div>'
  +'<div class="card"><b>Oʻyinchilar</b><div style="overflow-x:auto;margin-top:6px"><table class="tb"><tr><th>Ism</th><th>Oʻyin</th><th>Gʻalaba</th><th>Durang</th><th>Ball</th></tr>'+pt+'</table></div></div>'
  +'<div class="card"><b>Oxirgi oʻyinlar</b><div style="overflow-x:auto;margin-top:6px"><table class="tb"><tr><th>Vaqt</th><th>Soʻz</th><th>Hisob</th><th>Natija</th></tr>'+rt+'</table></div></div>'
  +'<button class="alt" id="rf" style="width:100%">🔄 Yangilash</button><p class="sub" style="margin:12px 0 0;font-size:13px">Statistika faqat hisob bilan kirgan oʻyinchilarning tugagan oʻyinlaridan yigʻiladi.</p>';
  $("rf").onclick=adminStats;
}

      if(DB)["en","uz"].forEach(function(l){DB.doc("lex/"+l).onSnapshot(function(s){LEX[l]=s.exists?s.data():null;if(VIEW==="admin"&&AT==="words")paintWords();},function(){});});
    }
